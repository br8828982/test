name: Generate OTT Playlist

on:
  schedule:
    - cron: "0 */11 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate OTT Playlist
        run: |
          JSON_URL="https://pkll.xojiv79335.workers.dev/"
          OUTPUT="ott.m3u"

          echo -e '#EXTM3U url-tvg="https://avkb.short.gy/jioepg.xml.gz"\n' > $OUTPUT

          curl -s "$JSON_URL" > data.json

          jq -r --rawfile ch channels.txt '
          def wanted: ($ch | split("\n") | map(select(length>0)));

          wanted[] as $name |
          .[] | select(.channel_name == $name) |

          "#EXTINF:-1 tvg-id=\"" + .channel_id +
          "\" group-title=\"" + .channel_genre +
          "\" tvg-logo=\"" + .channel_logo +
          "\"," + .channel_name + "\n" +

          "#KODIPROP:inputstream.adaptive.license_type=clearkey\n" +
          "#KODIPROP:inputstream.adaptive.license_key=" + .keyId + ":" + .key + "\n" +

          "#EXTVLCOPT:http-user-agent=plaYtv/7.1.3 (Linux;Android 13) ygx/69.1 ExoPlayerLib/824.0\n" +

          "#EXTHTTP:{\"cookie\":\"" + .cookie + "\"}\n" +

          .channel_url + "\n"
          ' data.json >> $OUTPUT

      - name: Commit OTT Playlist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ott.m3u
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update ott.m3u"
            git push
          fi
